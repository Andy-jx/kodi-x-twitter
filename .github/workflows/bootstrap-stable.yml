name: Bootstrap stable v1.0.6

on:
  push:
    branches: [ main ]
    paths:
      - '.release-assets/**'
      - '.github/workflows/bootstrap-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact tested package
        run: |
          mkdir -p dist
          cat .release-assets/x106.b64.* | base64 -d > dist/plugin.video.xtwitter-1.0.6.zip
          echo "ae934f65091d8dac8b68b357ef2765f5b3a2b14a22f50cadc5ff6439b5b4929a  dist/plugin.video.xtwitter-1.0.6.zip" | sha256sum -c -
          sha256sum dist/plugin.video.xtwitter-1.0.6.zip > dist/SHA256SUMS.txt

      - name: Restore stable source tree
        run: |
          rm -rf plugin.video.xtwitter
          unzip -q dist/plugin.video.xtwitter-1.0.6.zip -d .
          test -f plugin.video.xtwitter/addon.py
          test -f plugin.video.xtwitter/addon.xml
          test -f plugin.video.xtwitter/resources/settings.xml

      - name: Validate source
        run: |
          python -m compileall -q plugin.video.xtwitter
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('plugin.video.xtwitter/addon.xml').getroot()
          assert root.attrib.get('id') == 'plugin.video.xtwitter'
          assert root.attrib.get('version') == '1.0.6'
          print('Validated', root.attrib.get('id'), root.attrib.get('version'))
          PY
          find plugin.video.xtwitter -type d -name __pycache__ -prune -exec rm -rf {} +
          find plugin.video.xtwitter -type f -name '*.pyc' -delete

      - name: Commit stable source and clean bootstrap files
        run: |
          rm -rf .release-assets
          rm -f .github/workflows/bootstrap-stable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v1.0.6 stable source"
          git push origin HEAD:main

      - name: Create GitHub Release v1.0.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.6 >/dev/null 2>&1; then
            echo "Release v1.0.6 already exists."
            exit 0
          fi
          gh release create v1.0.6 \
            dist/plugin.video.xtwitter-1.0.6.zip \
            dist/SHA256SUMS.txt \
            --target main \
            --title "X for Kodi v1.0.6" \
            --notes $'Stable public baseline.\n\nVerified core features: Cookie login, For You, Following, manual refresh, search, author pages, local Favorites, fresh playback resolving and highest-bitrate playable MP4 selection.\n\nSecurity: never share your real X Cookie, auth_token or ct0 publicly.'
